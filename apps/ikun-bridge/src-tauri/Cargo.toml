[package]
name = "ikun-bridge"
version = "0.1.0"
description = "Local Claude privacy bridge"
edition = "2021"
rust-version = "1.85"
default-run = "ikun-bridge"

[lib]
name = "ikun_bridge_lib"
crate-type = ["lib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
base64 = "0.22"
bytes = "1"
dirs = "6"
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
rand = "0.8"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
sha1 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Rpc", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[[bin]]
name = "ikun-bridge"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "bridge-check"
path = "src/bin/bridge-check.rs"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true


name: 发布 IKUN2api

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅构建验证，不发布'
        required: true
        type: boolean
        default: true

concurrency:
  group: ikun2api-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/1812095643/ikun2api

jobs:
  release:
    # 单 job 直出：中间产物不经过 actions/upload-artifact，
    # 避免 GitHub Actions artifact 存储配额（每次发布约 1.3GB）成为发布死点。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - id: version
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import os,pathlib,re,subprocess
          version=pathlib.Path('backend/cmd/server/VERSION').read_text().strip()
          assert re.fullmatch(r'\d+\.\d+\.\d+',version),'Use a stable semantic version'
          if os.environ['RELEASE_TYPE']=='tag':assert os.environ['RELEASE_REF']=='v'+version,'Tag and VERSION must match'
          assert pathlib.Path('changelog/'+version+'/CHANGELOG.md').is_file(),'Release notes required'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              print('version='+version,file=out)
              print('commit='+subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),file=out)
          PY

      # ---------------- 验证 ----------------

      - name: 前端类型、文案与生产构建
        working-directory: frontend
        env:
          # vue-tsc -b 在干净 checkout 上做全量类型检查，默认 2GB 堆会 OOM
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm install --frozen-lockfile && pnpm exec vitest run src/components/common/__tests__/SystemUpdateDialog.spec.ts src/composables/__tests__/useUsageFilterVisibility.spec.ts src/components/common/__tests__/FilterSettingsDropdown.spec.ts src/components/admin/usage/__tests__/UsageFilters.spec.ts src/views/admin/__tests__/UsageView.spec.ts src/views/user/__tests__/UsageView.spec.ts src/components/common/__tests__/UpgradeBackupSettings.spec.ts src/views/auth/__tests__/ResetPasswordView.spec.ts src/views/__tests__/HomeView.compact.spec.ts src/components/admin/settings/__tests__/ClaudeTelemetrySettings.spec.ts src/components/group/__tests__/ClaudeDesktopAccessOption.spec.ts src/components/group/__tests__/ClaudeWeeklyResetPriorityOption.spec.ts src/views/admin/__tests__/GroupsView.duplicate.spec.ts src/constants/__tests__/platforms.spec.ts src/components/account/__tests__/credentialsBuilder.platformCatalog.spec.ts src/components/admin/group/__tests__/GroupI18nField.spec.ts && pnpm build
      - name: Persistent update and backup retention regression
        working-directory: backend
        run: go test -tags unit ./internal/service ./internal/handler/admin -run 'Test(UpdateService|UpdateRelease|UpdateDownload|UpdateVersion|UpdateBackup|UpdateMaintenance|UpdateExtract|UpdateJournal|UpdatePrepare|UpgradeBackups|PersistentRuntime|SystemHandler|SystemUpdate)' -count=1 -timeout=180s
      - name: Claude 每周窗口调度与分享链接导入回归
        working-directory: backend
        run: go test -tags unit ./internal/service ./internal/handler/admin ./internal/handler/dto ./internal/repository -run 'Test(ClaudeWeeklyReset|AdminGroupWeeklyReset|GroupRequests_WeeklyReset|GroupMapper_WeeklyReset|APIKeyAuthSnapshot_WeeklyReset|CustomMenuAcceptsPoolShare)' -count=1 -timeout=180s
      - name: 分组价格变化与精简更新面板回归
        run: |
          cd backend
          go test -tags unit ./internal/handler/dto ./internal/handler ./internal/service -run 'Test(GroupMapper_PriceChange|ListPlazaGroups|WorkspacePlazaGroups|ToModelPlazaGroupDTO)' -count=1 -timeout=180s
          go test -tags integration ./internal/repository -run '^TestGroupRepoSuite$/^TestPriceChangeHistory$' -count=1 -timeout=240s
          cd ../frontend
          pnpm exec vitest run src/components/common/__tests__/GroupPriceChangeBadge.spec.ts src/components/common/__tests__/GroupOptionItem.spec.ts src/components/common/__tests__/VersionBadge.spec.ts src/views/user/__tests__/KeysView.spec.ts src/components/modelPlaza/__tests__/PlazaGroupSection.spec.ts
      - name: 模型广场原价与渠道实付分离回归
        run: |
          cd backend
          go test -tags unit ./internal/service ./internal/handler -run 'Test(ListPlazaGroups|WorkspacePlazaGroups|ListGroups_(TokenLadder|GeminiCatalog|GroupToken|ImageModel|CatalogMissing|TimePricing)|PlazaOriginal|PlazaUnknown|WorkspacePlazaOriginal|ToModelPlaza|ModelPlazaHandler)' -count=1 -timeout=180s
          cd ../frontend
          pnpm exec vitest run src/composables/workspace/modelPrices.spec.ts src/components/workspace/models/ModelCard.spec.ts src/components/modelPlaza/__tests__/PlazaModelPricingTable.spec.ts src/components/modelPlaza/__tests__/PlazaGroupSection.spec.ts
      - name: Cross-site pool share credentials and read-only bootstrap regression
        run: |
          cd frontend
          pnpm exec vitest run src/utils/__tests__/poolShareLink.spec.ts src/utils/__tests__/embedded-url.spec.ts src/__tests__/poolShareApp.spec.ts src/views/user/__tests__/CustomPageView.spec.ts
          cd ../backend
          go test -tags unit ./internal/server/middleware -run 'TestPoolShare|TestSecurityHeaders' -count=1
      - name: 分享页打包模式响应头回归
        working-directory: backend
        run: go test -tags embed ./internal/web -run TestFrontendServerPoolShareHeaders -count=1
      - name: 新订阅、号池与原版更新界面回归
        run: |
          cd backend
          go test -tags unit ./internal/service ./internal/handler ./internal/handler/dto ./internal/handler/admin ./internal/repository ./internal/server/routes ./internal/server/middleware ./cmd/server -run 'Test(Universal|AccountModelAllowlist|AccountPool|PoolHandler|PoolShare|PoolUserQueries|UsageLogFromService_AccountSnapshots)' -count=1 -timeout=180s
          cd ../frontend
          pnpm exec vitest run src/components/common/__tests__/VersionBadge.spec.ts src/config/menuPages.spec.ts src/views/admin/settings/__tests__/MenuManagementSettings.spec.ts src/views/admin/__tests__/PoolView.spec.ts src/api/__tests__/pool.spec.ts src/api/__tests__/poolShare.spec.ts src/views/public/__tests__/PoolShareView.spec.ts src/composables/__tests__/usePoolRequest.spec.ts src/composables/__tests__/usePoolRefresh.spec.ts src/components/pool/__tests__/PoolRequestsDialog.spec.ts src/components/pool/__tests__/PoolDisplaySettings.spec.ts src/components/pool/__tests__/UserPoolPanel.spec.ts src/components/pool/__tests__/UserPoolUsageTable.spec.ts src/utils/__tests__/outputRate.spec.ts src/components/admin/usage/__tests__/UsageTable.spec.ts src/components/admin/account-vault/VaultImportDialog.spec.ts src/components/admin/account-vault/VaultSecurityToggle.spec.ts src/views/admin/__tests__/AccountsView.lite.spec.ts src/components/account/__tests__/ClaudeModelAllowlistField.spec.ts src/views/admin/orders/__tests__/UniversalPlanEditDialog.spec.ts src/components/payment/__tests__/UniversalSubscriptionCard.spec.ts
      - name: 上游模型监控与公告回归
        run: |
          cd backend
          go test ./internal/workspace -count=1
          cd ../frontend
          pnpm exec vitest run src/components/common/__tests__/AnnouncementPopup.spec.ts src/components/common/__tests__/AnnouncementTimeline.spec.ts src/components/admin/upstream-balances/__tests__/UpstreamBalances.spec.ts src/components/admin/upstream-balances/__tests__/UpstreamModels.spec.ts src/stores/__tests__/announcements.fetch.spec.ts src/stores/__tests__/announcements.markAll.spec.ts
      - name: 更新、安全与备份回归
        working-directory: backend
        run: go test -tags unit ./internal/service ./internal/repository ./internal/handler/admin ./internal/server/middleware -run 'Test(Update|Upgrade|SystemHandler|CompareVersions|ParseVersion|ValidateDownload|GitHubRelease|PgDumper)' -count=1 -timeout=180s && go test -tags unit ./internal/handler -run '^TestSettingHandlerVersionMatchesHTMLInjection$' -count=1
      - name: Claude 隐私过滤与遥测回归
        working-directory: backend
        run: go test -tags unit ./internal/service ./internal/handler ./internal/handler/admin ./internal/server/routes ./internal/server/middleware ./internal/pkg/claude -run 'Test(ClaudePrivacy|ClaudeDesktop|AdminGroupClaudeDesktop|ClaudeTelemetry|LocalClaudeTelemetry|GatewayClaude|GatewayService_ForwardSignatureRepair|ForwardClaudeThinking|ClaudeThinkingRecovery|StripClaudeThinkingHistory|ToolResponseIntegrity|ForwardToolResponseIntegrity|ClaudeThinkingTrace|ClaudeToolText|ForwardClaudeToolText|ParseClaudeTelemetry|BuildClaudeTelemetry|SanitizeClaude|Telemetry)' -count=1 -timeout=180s
      - name: 上游历史缺项回归
        working-directory: backend
        run: >-
          go test -tags unit ./internal/pkg/apicompat ./internal/pkg/claude ./internal/service/openai_ws_v2
          -run 'Test(.*Refusal|.*LegacyFunction|.*ToolChoice|.*Developer|.*ThinkingSignature|.*Haiku|Relay_ImageUsage)'
          -count=1 -timeout=180s &&
          go test -tags unit ./internal/service ./internal/handler
          -run 'Test(NormalizeCacheControlTTLOrder|EnforceCacheControlLimit|ValidateClaude55Request_Haiku55|GPT61SolAPIKeyCatalog|OpenAISubscriptionLongContextExempt|OpenAIGatewayServiceRecordUsage_GPT61SolSubscriptionLongContext|OpenAIGatewayService_OAuth.*StreamFalse|BuildPlatformCatalog|FrontendBuiltinPlatformCatalog|OpenAIResponsesWebSocket_GroupRateChange)'
          -count=1 -timeout=180s
      - name: 运维错误过滤与账号限流回归
        run: |
          cd backend
          go test -tags unit ./internal/handler ./internal/service -run 'Test(Ops|GetOpsAdvancedSettings|UpdateOpsAdvancedSettings|Handle429|HandleUpstreamError_Anthropic|CalculateAnthropic429|Anthropic429|GetRateLimit429|SetRateLimit429)' -count=1 -timeout=180s
          cd ../frontend
          pnpm exec vitest run src/views/admin/ops/components/__tests__/OpsSettingsDialog.clientRestriction.spec.ts src/i18n/__tests__/opsLocaleKeys.spec.ts
      - name: 发布脚本检查
        run: |
          python3 -m unittest discover -s scripts/release -p test_release.py
          python3 -m py_compile deploy/switch-from-sub2api.py scripts/release/build.py scripts/release/sign.py
          bash -n deploy/migrate.sh deploy/docker-entrypoint.sh
      - name: Quick Use, CC Switch and Magpie import regression
        working-directory: frontend
        run: pnpm exec vitest run src/utils/__tests__/ccswitchImport.spec.ts src/utils/__tests__/ccswitchImport.antigravityUrl.spec.ts src/components/keys/__tests__/CcSwitchImportDialog.spec.ts src/components/keys/__tests__/UseKeyModal.spec.ts src/api/__tests__/ccswitch.spec.ts src/utils/__tests__/magpieImport.spec.ts src/components/keys/__tests__/KeyQuickUseDialog.spec.ts src/components/keys/__tests__/MagpieImportDialog.spec.ts

      # ---------------- 五个平台二进制 ----------------

      - name: 释放 runner 磁盘空间
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          rm -rf frontend/node_modules || true
          sudo docker image prune -af || true
          sudo docker builder prune -af || true
          df -h /

      - name: 编译五个平台二进制
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          set -euo pipefail
          for TARGET in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64; do
            echo "::group::build $TARGET"
            python3 scripts/release/build.py --target "$TARGET" --version "$VERSION" --commit "$COMMIT"
            go clean -cache || true
            echo "::endgroup::"
          done
          ls -lh dist/release

      # ---------------- 双架构运行镜像 ----------------

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag' || inputs.dry_run == false
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建可直接迁入的运行镜像
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
          PUBLISH: ${{ github.ref_type == 'tag' || inputs.dry_run == false }}
        run: |
          set -euo pipefail
          for ARCH in amd64 arm64; do
            echo "::group::image linux/$ARCH"
            rm -rf dist/docker
            mkdir -p dist/docker/deploy dist/docker/backend
            tar -xzf "dist/release/ikun2api_${VERSION}_linux_${ARCH}.tar.gz" -C dist/docker ikun2api
            cp deploy/docker-entrypoint.sh dist/docker/deploy/
            cp -r backend/resources dist/docker/backend/
            cp Dockerfile.goreleaser dist/docker/Dockerfile
            docker buildx build --platform "linux/$ARCH" --load -t "$REGISTRY_IMAGE:$VERSION" -t "$REGISTRY_IMAGE:$VERSION-$ARCH" --label "org.opencontainers.image.revision=$COMMIT" --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" dist/docker
            test "$(docker run --rm --platform linux/$ARCH --entrypoint sha256sum "$REGISTRY_IMAGE:$VERSION" /app/ikun2api | cut -d' ' -f1)" = "$(sha256sum dist/docker/ikun2api | cut -d' ' -f1)"
            docker save "$REGISTRY_IMAGE:$VERSION" | gzip -1 > "dist/release/ikun2api_image_${VERSION}_linux_${ARCH}.tar.gz"
            if [ "$PUBLISH" = true ]; then docker push "$REGISTRY_IMAGE:$VERSION-$ARCH"; fi
            docker rmi -f "$REGISTRY_IMAGE:$VERSION" "$REGISTRY_IMAGE:$VERSION-$ARCH" >/dev/null 2>&1 || true
            docker builder prune -af >/dev/null 2>&1 || true
            df -h /
            echo "::endgroup::"
          done
          rm -rf dist/docker
          ls -lh dist/release

      # ---------------- 汇总、签名 ----------------

      - name: 打包对应源码与完整发布信息
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix="ikun2api-${VERSION}/" -o "dist/release/ikun2api_${VERSION}_source.tar.gz" "$COMMIT"
          cp "changelog/$VERSION/CHANGELOG.md" dist/release/CHANGELOG.md
          cp deploy/MIGRATION.md dist/release/MIGRATION.md
          python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path('dist/release/release-manifest.json').write_text(json.dumps({'version':os.environ['VERSION'],'commit':os.environ['COMMIT'],'repository':'1812095643/ikun2api','upstream_baseline':'0.2.20','schema_forward_only':True,'signature':'Ed25519'},indent=2))
          PY
      - name: 生成并签名完整校验清单
        env:
          IKUN_RELEASE_SIGNING_KEY: ${{ secrets.IKUN_RELEASE_SIGNING_KEY }}
        run: python3 -m pip install cryptography && python3 scripts/release/sign.py

      # ---------------- 部署演练 ----------------

      - name: 从官方版本带数据切换并验证重建持久性
        run: sudo -E env PATH="$PATH" python3 scripts/release/rehearse-compose.py

      # ---------------- 发布 ----------------

      - name: 发布正式 GitHub Release
        if: github.ref_type == 'tag' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" dist/release/* --verify-tag --title "IKUN2api $VERSION" --notes-file "changelog/$VERSION/CHANGELOG.md" --latest
      - name: 发布多架构版本与 latest 镜像
        if: github.ref_type == 'tag' || inputs.dry_run == false
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: docker buildx imagetools create --tag "$REGISTRY_IMAGE:$VERSION" --tag "$REGISTRY_IMAGE:latest" "$REGISTRY_IMAGE:$VERSION-amd64" "$REGISTRY_IMAGE:$VERSION-arm64"

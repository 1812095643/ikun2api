name: 手动验证

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 构建前端
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: 验证协议与身份兼容
        working-directory: backend
        run: go test -tags unit ./internal/service -run 'Test(ClaudeOriginalEntrypointsRemainAccepted|ClaudeEntrypointCleanupKeepsAPIKeyPath|LocalClaudeTelemetry|GetOrCreateFingerprint|CreateFingerprintFromHeaders|IsAcceptableFingerprintUserAgent|DefaultFingerprintUserAgent|FloorClaudeCLIUserAgentVersion)' -count=1
      - name: 编译服务端
        working-directory: backend
        run: CGO_ENABLED=0 go build -tags embed -trimpath -o /tmp/ikun2api ./cmd/server
